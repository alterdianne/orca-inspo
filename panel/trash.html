<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: var(--orca-background, #fff);
        --fg: var(--orca-foreground, #1a1a1c);
        --muted: var(--orca-muted-foreground, #78787d);
        --border: var(--orca-border, #e8e8ea);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        color: var(--fg);
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }
      header { padding: 12px 16px 8px; font-weight: 600; }
      .empty {
        flex: 1;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 8px;
        color: var(--muted);
        text-align: center;
        padding: 16px;
      }
      .empty svg { width: 32px; height: 32px; }
      .empty strong { color: var(--fg); font-weight: 600; }
    </style>
  </head>
  <body>
    <header>Trash</header>
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
      </svg>
      <strong>Trash is empty</strong>
      <span>Test panel v1</span>
    </div>
  </body>
</html>
